# .github/workflows/greeting.yml
name: Daily Greeting
on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes

jobs:
  greet1:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Good morning, team!"

    greet2:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Good Afternoon, team!"

  greet3:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Good Evening, team!"